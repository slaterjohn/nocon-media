# Development / test infrastructure only. Ports bound to localhost.
name: nocon-dev
services:
  postgres:
    image: postgres:17.11-alpine3.24@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment: { POSTGRES_USER: nocon, POSTGRES_PASSWORD: nocon, POSTGRES_DB: nocon }
    ports: ["127.0.0.1:55432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nocon"], interval: 2s, retries: 30 }
    tmpfs: ["/var/lib/postgresql/data"]
  redis:
    image: redis:7.4.12-alpine3.21@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    ports: ["127.0.0.1:56379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 2s, retries: 30 }
