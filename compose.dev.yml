# Development / test infrastructure only. Ports bound to localhost.
name: nocon-dev
services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: nocon, POSTGRES_PASSWORD: nocon, POSTGRES_DB: nocon }
    ports: ["127.0.0.1:55432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nocon"], interval: 2s, retries: 30 }
    tmpfs: ["/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 2s, retries: 30 }
