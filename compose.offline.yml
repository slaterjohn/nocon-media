# Offline override: no service has any route to the internet.
#   docker compose -f compose.yml -f compose.offline.yml --profile offline-test up --abort-on-container-exit
# scripts/offline-test.sh drives this. Published ports are removed (they do not work on internal
# networks everywhere); the `offline-test` service runs the checks from inside the internal network.
services:
  api:
    ports: !reset []
  web:
    ports: !reset []
  worker:
    networks: !override [backend]
  offline-test:
    image: node:24.22.2-trixie-slim@sha256:54f84b4cf8432b21aaffd5d3ce8d41e12cea0d10d33c09d2f3c9879d49d6b446
    profiles: [offline-test]
    working_dir: /tests
    command: ["node", "check.mjs"]
    environment:
      API_URL: http://api:3001
      WEB_URL: http://web:3000
      MEDIA_DIR: /media
      OFFLINE_ADMIN_PASSWORD: ${OFFLINE_ADMIN_PASSWORD:-offline-test-password-1}
    volumes:
      - ./tests/offline:/tests:ro
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    networks: [frontend]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  frontend:
    internal: true
    driver_opts: !reset {}
