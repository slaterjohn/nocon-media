name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nocon
          POSTGRES_PASSWORD: nocon
          POSTGRES_DB: nocon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nocon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://nocon:nocon@127.0.0.1:5432/nocon
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm vitest run --project unit

      - name: Integration tests
        run: pnpm vitest run --project integration

      - name: Validate compose file
        run: docker compose --env-file .env.example config --quiet

  # Linux check of the network layout: `api` and `web` sit on `backend` (internal) and `frontend` (IP masquerade off),
  # so they must not reach the internet. Docker Desktop for Mac ignores the masquerade setting, so this needs a Linux host.
  # `worker` is on `egress` by design (it downloads), so it is not checked here; scripts/offline-test.sh removes that too.
  stack:
    name: stack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Compose up, health and egress check
        env:
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
          NOCON_PROXY_SECRET: ci-compose-only-${{ github.run_id }}
        run: |
          export MEDIA_PATH="$RUNNER_TEMP/media" DATA_PATH="$RUNNER_TEMP/data"
          mkdir -p "$MEDIA_PATH" "$DATA_PATH" && chmod 777 "$MEDIA_PATH" "$DATA_PATH"
          docker compose up -d --build --wait --wait-timeout 300
          curl -fsS -o /dev/null -w "web %{http_code}\n" http://127.0.0.1:3000/login || { docker compose logs --tail 80; exit 1; }
          rc=0
          for svc in api web; do
            if docker compose exec -T "$svc" node -e "fetch('https://www.youtube.com',{signal:AbortSignal.timeout(6000)}).then(()=>process.exit(1),()=>process.exit(0))"; then
              echo "PASS  $svc cannot reach https://www.youtube.com"
            else
              echo "FAIL  $svc REACHED https://www.youtube.com"; rc=1
            fi
          done
          docker compose down -v
          exit $rc
      - name: Offline stack test
        run: scripts/offline-test.sh

  # Browser tests. Chromium runs every spec; Firefox and WebKit run the media subset (playwright.config.ts ENGINE_SPECS).
  # One engine per step: they share ports 24000/24001. global-setup starts Postgres and Redis with compose.dev.yml.
  # WebKit stays advisory until it has a track record (it is not Safari, and its Linux build may lack H.264).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Browser end-to-end tests, Chromium
        run: pnpm test:e2e
      - name: Browser end-to-end tests, Firefox
        run: pnpm test:e2e:firefox
      - name: Browser end-to-end tests, WebKit (advisory)
        continue-on-error: true
        run: pnpm test:e2e:webkit
